<!DOCTYPE html>
<html>
<head>
    <title>Admit Card Form</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            padding: 12px;
            border: none;
            width: 95%;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Admit Card Generator</h2>

    <form action="admit" method="post">
        <input type="text" name="name" placeholder="Enter Name" required>
        <input type="text" name="usn" placeholder="Enter USN" required>
        <input type="text" name="branch" placeholder="Branch" required>
        <input type="text" name="sem" placeholder="Semester" required>

        <button type="submit">Generate Admit Card</button>
    </form>
</div>

</body>
</html>
